name: Dotnet Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test api-restsharp -c Release

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build ui-playwright -c Release
      - run: pwsh ui-playwright/bin/Release/net8.0/playwright.ps1 install --with-deps chromium
      - run: dotnet test ui-playwright -c Release --no-build --settings ui-playwright/ui.runsettings
